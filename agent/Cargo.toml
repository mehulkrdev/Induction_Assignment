[package]
name = "enrollment-agent"
version = "0.1.0"
edition = "2021"

[dependencies]
# Async runtime
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1.89"

# TLS handling
rustls = "0.21"
tokio-rustls = "0.24"
webpki-roots = "0.25"

# mDNS Discovery
mdns-sd = "0.9"

# Crypto & Hashing
ring = "0.17"
hex = "0.4"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.13.3", features = ["json"] }

# Mocking for TDD
[dev-dependencies]
mockall = "0.11"
