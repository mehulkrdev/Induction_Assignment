[package]
name = "enrollment-agent"
version = "0.1.0"
edition = "2021"

[dependencies]
# Async runtime
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1.89"

# TLS handling
rustls = "0.21"
tokio-rustls = "0.24"
webpki-roots = "0.25"

# mDNS Discovery

# Crypto & Hashing
ring = "0.17"
hex = "0.4"
p256 = { version = "0.13", features = ["pem", "ecdsa"] }
pkcs8 = { version = "0.10", features = ["pem"] }
rand_core = { version = "0.6", features = ["getrandom"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }

# Logging utilities
chrono = "0.4"
once_cell = "1.18"

# Mocking for TDD
[dev-dependencies]
mockall = "0.11"
