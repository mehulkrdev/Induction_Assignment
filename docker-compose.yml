services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "8443:8443"
      - "8444:8444"
    volumes:
      - /mnt/c/Assignment/Logs:/Assignment/Logs
      - ./data:/app/data
    environment:
      - WORKSPACE_ROOT=/app # Explicitly set for container runtime. Do not remove.
      - LOG_ROOT_DIR=/Assignment/Logs
      - GO_TEST_DIR=/Assignment/server/tests
      - AGENT_LOG_DIR=/Assignment/Logs
      - ENROLLMENT_TOKEN=valid-token
